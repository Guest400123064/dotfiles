# ============================================================================
# tmux configuration
# Compatible with Linux and macOS
# Uses vim key bindings
# ============================================================================

# ----------------------------------------------------------------------------
# Terminal compatibility
# ----------------------------------------------------------------------------
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# ----------------------------------------------------------------------------
# General settings
# ----------------------------------------------------------------------------
# Increase scrollback buffer
set-option -g history-limit 10000

# Start windows and panes at 1, not 0
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set-option -g renumber-windows on

# Enable mouse support (works on both Linux and macOS)
set-option -g mouse on

# Focus events enabled for terminals that support them
set-option -g focus-events on

# Aggressive resize - resize windows when smaller client detaches
set-window-option -g aggressive-resize on

# ----------------------------------------------------------------------------
# Key bindings - Vim style
# ----------------------------------------------------------------------------
# Change prefix key from C-b to C-a (easier to reach, but can conflict with screen)
# Uncomment if you prefer C-a:
set-option -g prefix C-a
bind-key C-a send-prefix

# Use vim key bindings for copy mode
set-window-option -g mode-keys vi

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style window navigation
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Split panes using | and - (vim style)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind-key '"'
unbind-key %

# Vim-style copy mode key bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Paste
bind-key p paste-buffer

# Reload config file
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ----------------------------------------------------------------------------
# Copy mode settings
# ----------------------------------------------------------------------------
# Use vim keys in copy mode
set-window-option -g mode-keys vi

# Copy to system clipboard (works on both Linux and macOS)
# Linux: requires xclip or xsel
# macOS: works out of the box
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || pbcopy"

# ----------------------------------------------------------------------------
# Status bar (Tokyo Night inspired colors)
# ----------------------------------------------------------------------------
# Tokyo Night palette: bg #1a1b26, fg #c0caf5, blue #7aa2f7
# Uses hex colors (requires terminal with true color / Tc)
set-option -g status-interval 1
set-window-option -g monitor-activity on
set-option -g visual-activity off

# Status bar: Tokyo Night bg, light blue text
set-option -g status-style "fg=#c0caf5 bg=#1a1b26"

# Windows: dim inactive, bright blue active
set-window-option -g window-status-style "fg=#565f89 bg=#1a1b26"
set-window-option -g window-status-current-style "fg=#7aa2f7 bg=#1a1b26 bold"

# Left: session name
set-option -g status-left-length 40
set-option -g status-left "#[fg=#7aa2f7,bg=#1a1b26,bold] #S "

# Right: hostname only (no datetime)
set-option -g status-right-length 30
set-option -g status-right "#[fg=#565f89,bg=#1a1b26] #h "

# ----------------------------------------------------------------------------
# Pane borders
# ----------------------------------------------------------------------------
set-option -g pane-border-style "fg=#565f89"
set-option -g pane-active-border-style "fg=#7aa2f7"

# ----------------------------------------------------------------------------
# Window titles
# ----------------------------------------------------------------------------
set-option -g set-titles on
set-option -g set-titles-string "#T - #W"

# ----------------------------------------------------------------------------
# Bell and alerts
# ----------------------------------------------------------------------------
set-window-option -g window-status-bell-style "fg=#1a1b26 bg=#f7768e bold"
set-option -g visual-bell off
set-option -g bell-action none

# ----------------------------------------------------------------------------
# Performance optimizations for remote connections
# ----------------------------------------------------------------------------
# Reduce escape-time for faster response (useful for SSH connections)
set-option -sg escape-time 10

# Increase repeat-time for faster key repeats
set-option -g repeat-time 300

# ----------------------------------------------------------------------------
# Session management
# ----------------------------------------------------------------------------
# Easier session switching
bind-key S choose-session

# ----------------------------------------------------------------------------
# Window management
# ----------------------------------------------------------------------------
# Create new window with current path
bind-key c new-window -c "#{pane_current_path}"

# Kill window without confirmation
bind-key & kill-window

# ----------------------------------------------------------------------------
# Pane management
# ----------------------------------------------------------------------------
# Swap panes
bind-key -r H swap-pane -D
bind-key -r L swap-pane -U

# Resize panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# Toggle pane zoom
bind-key z resize-pane -Z

# ----------------------------------------------------------------------------
# Additional vim-style bindings
# ----------------------------------------------------------------------------
# Quick window selection
bind-key -r 1 select-window -t :1
bind-key -r 2 select-window -t :2
bind-key -r 3 select-window -t :3
bind-key -r 4 select-window -t :4
bind-key -r 5 select-window -t :5
bind-key -r 6 select-window -t :6
bind-key -r 7 select-window -t :7
bind-key -r 8 select-window -t :8
bind-key -r 9 select-window -t :9

# ----------------------------------------------------------------------------
# Compatibility notes
# ----------------------------------------------------------------------------
# This config is designed to work on both Linux and macOS
# - Mouse support works on both platforms
# - Clipboard integration uses xclip (Linux) or pbcopy (macOS)
# - All key bindings use standard tmux commands compatible with tmux 2.0+
# - No hardcoded paths or system-specific configurations
